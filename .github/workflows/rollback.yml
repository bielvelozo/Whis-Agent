name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA pra reverter (full 40-char SHA)'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: SSH rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SHA format
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid SHA format. Need full 40-char hex."
            exit 1
          fi

      - name: SSH + run deploy.sh with rollback SHA
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/whis
            git fetch --depth=1 origin main
            git -c advice.detachedHead=false checkout ${{ inputs.sha }}
            bash infra/deploy.sh ${{ inputs.sha }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode=HTML \
            --data-urlencode "text=⚠️ <b>Whis rollback falhou</b>%0ATarget SHA: <code>${SHA}</code>%0A<a href=\"${RUN_URL}\">Run</a>"

      - name: Notify Telegram on success
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SHA: ${{ inputs.sha }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode=HTML \
            --data-urlencode "text=↩️ <b>Whis rollback OK</b>%0ASHA: <code>${SHA}</code>"
