name: whis

services:
  postgres:
    profiles: [whatsapp]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  evolution-api:
    profiles: [whatsapp]
    image: evoapicloud/evolution-api:v2.3.7
    env_file: profile/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      - "8081:8080"
    restart: unless-stopped

  whis-worker:
    image: ghcr.io/bielvelozo/whis-worker:${WHIS_IMAGE_TAG:-latest}
    env_file: profile/.env
    init: true
    ports:
      # Auth callback do MCP @cocal/google-calendar-mcp — escolhe porta livre em 3500-3505
      # pra OAuth flow. Browser do user (host) precisa alcançar o callback do container.
      - "3500-3505:3500-3505"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - whis_data:/app/data
      - claude_home:/home/node/.claude
      - gcal_tokens:/home/node/.config
      - ./agent:/app/agent:ro
      - ./profile:/app/profile:ro
      - ./context:/app/context
      # Seed tarballs pra auto-restore de volumes no boot (entrypoint.sh).
      # Read-only — restore extrai pra dentro dos volumes nomeados (ex: gcal_tokens),
      # não escreve de volta aqui. Tarball é gerado/atualizado manualmente (workflow R6).
      - ./backups:/app/backups:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  whis_data:
  evolution_instances:
  evolution_store:
  evolution_pg_data:
  gcal_tokens:
  claude_home:
    external: true
