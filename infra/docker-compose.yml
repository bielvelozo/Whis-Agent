name: whis

services:
  postgres:
    profiles: [whatsapp]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  evolution-api:
    profiles: [whatsapp]
    image: evoapicloud/evolution-api:v2.3.7
    env_file: profile/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      - "8081:8080"
    restart: unless-stopped

  whis-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: whis-worker:dev
    env_file: profile/.env
    init: true
    volumes:
      - whis_data:/app/data
      - claude_home:/home/node/.claude
      - ./agent:/app/agent:ro
      - ./profile:/app/profile:ro
      - ./context:/app/context
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  whis_data:
  evolution_instances:
  evolution_store:
  evolution_pg_data:
  claude_home:
    external: true
